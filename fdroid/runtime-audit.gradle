import groovy.json.JsonOutput
allprojects { project ->
    afterEvaluate {
        if (project.path == ':app') {
            tasks.register('writeFdroidRuntimeDependencies') {
                doLast {
                    def rows = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
                        it.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    }.collect {
                        [group: it.moduleVersion.id.group, name: it.moduleVersion.id.name,
                         version: it.moduleVersion.id.version, type: it.extension]
                    }.unique().sort { a, b -> (a.group + ':' + a.name) <=> (b.group + ':' + b.name) }
                    new File(System.getenv('FDROID_RUNTIME_REPORT') ?: '/build/maven-runtime.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(rows))
                }
            }
        }
    }
}
