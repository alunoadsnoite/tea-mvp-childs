RepoType: git
Repo: https://github.com/alunoadsnoite/tea-mvp-childs.git

Builds:
  - versionName: 1.1.5
    versionCode: 5
    commit: b89f6b7612c03a1291bfedf5a7cfb3edeec3e690
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ../..
      - EXPO_NO_TELEMETRY=1 npm ci --no-audit --no-fund
      - python3 fdroid/prepare.py
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/build.gradle.kts
        node_modules/@react-native/gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e 's/agp = "8.1.1"/agp = "8.2.2"/' -e 's/kotlin = "1.8.0"/kotlin =
        "1.9.22"/' node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml
      - FDROID_BUILD=1 EXPO_NO_TELEMETRY=1 npx --no-install expo prebuild -p android
        --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - echo >> android/gradle.properties
      - echo android.kotlinVersion=1.9.22 >> android/gradle.properties
      - sed -i s/gradle-8.3-all/gradle-8.5-all/ android/gradle/wrapper/gradle-wrapper.properties
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-haptics/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-splash-screen/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-core/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/expo/android/build.gradle
      - node_modules/expo-file-system/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-keep-awake/android/build.gradle
      - node_modules/expo-font/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-constants/android/build.gradle
      - node_modules/expo-system-ui/android/build.gradle
    scandelete:
      - node_modules
    ndk: 25.1.8937393

MaintainerNotes: |-
  Follows templates/build-react-native.yml. android/app/.gitkeep keeps the subdir
  available before init; Expo generates native sources during prebuild.
  Uses the buildserver JDK 21 with the template toolchain patch. Expo SDK 50
  builds its native modules from source. Gradle 8.5 supports the Java 21 runtime;
  AGP 8.2.2 fixes the older jlink issue and Kotlin 1.9.22 supports JVM 21 targets.
  No separate JDK download or Java 17 override is used.
  No Firebase or install-referrer patches are needed by this dependency set.
  FDROID_BUILD enables unsigned APK output and removes unused npm-local Maven repositories.
  Hermes is selected; unused JSC AARs and non-Linux Hermes compilers are removed before scanning.
  The official Linux Hermes compiler follows the explicit inclusion-policy exception.
  The listed Gradle files contain FOSS local publishing repositories or legacy RN-local
  repositories. All were inspected: no proprietary coordinates; dependencies resolve
  from Maven Central/Google. These narrow exceptions prevent scandelete deleting
  required build scripts. The APK is also scanned for non-free code.
  scandelete removes other flagged npm prebuilts; no proprietary SDK is knowingly excluded.
  Related RFP: https://gitlab.com/fdroid/rfp/-/work_items/4552

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app.json|"versionCode":\s*(\d+)|.|"version":\s*"([\d.]+)"
CurrentVersion: 1.1.5
CurrentVersionCode: 5
